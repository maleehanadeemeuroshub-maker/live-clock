<style>
  :root{
    --bg: #000000;

    --card-bg: #111111;

    --surface-2: #101010;
    --hover-bg: #1c1c1c;

    margin: 0;
    height: 100%;

    color: var(--fg);

    overflow: hidden;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .app{
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ---------- top bar ---------- */
  .topbar{
    flex: 0 0 auto;
    height: 66px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 30;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .brand-icon{
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: block;
  }

  .nav-wrap{ position: relative; }

  .nav-dropdown-btn{
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-dropdown-btn svg{ width: 12px; height: 12px; transition: transform .2s ease; }
  .nav-dropdown-btn.open svg{ transform: rotate(180deg); }

  .nav-menu{
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    width: 190px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    display: none;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }
  .nav-menu.open{ display: block; }

  .nav-item{
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-tertiary);
    text-decoration: none;
    cursor: pointer;
  }
  .nav-item:hover{ background: var(--hover-bg); }
  .nav-item.selected{
    background: rgba(47,127,255,0.14);
    color: var(--blue);
    font-weight: 600;
  }

  .icon-row{ display: flex; gap: 10px; }

  .icon-btn{
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-secondary);
  }
  .icon-btn:hover{ background: var(--hover-bg); }
  .icon-btn.active{ background: var(--blue); border-color: var(--blue); color: #fff; }
  .icon-btn svg{ width: 18px; height: 18px; }
  .icon-btn .icon-moon{ display: none; }
  .icon-btn.is-light .icon-sun{ display: none; }
  .icon-btn.is-light .icon-moon{ display: block; }

  /* ---------- body row ---------- */
  .body-row{
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .stage{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    min-width: 0;
  }

  .flip-row{
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.4vw, 16px);
  }

  .flip-colon{
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2.6vw, 30px);
    padding: 0 4px;
  }
  .flip-colon-dot{
    width: clamp(6px, 1.2vw, 14px);
    height: clamp(6px, 1.2vw, 14px);
    border-radius: 3px;
    background: var(--fg);
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
  }

  .flip-unit{
    position: relative;
    width: clamp(56px, 9vw, 128px);
    height: clamp(84px, 13.5vw, 192px);
    perspective: 400px;
  }
  .flip-unit .card-static{
    position: absolute;
    inset: 0;
    border-radius: 10px;
    background: var(--flip-bg);
    overflow: hidden;
    box-shadow: 0 8px 24px var(--flip-shadow);
  }
  .flip-unit .half{
    position: absolute;
    left: 0; right: 0;
    height: 50%;
    overflow: hidden;
    background: var(--flip-bg);
    display: flex;
    justify-content: center;
  }
  .flip-unit .half span{
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-weight: 800;
    font-size: clamp(44px, 7.2vw, 104px);
    color: var(--accent);
    line-height: 1;
  }
  .flip-unit .top{ top: 0; align-items: flex-end; border-radius: 10px 10px 0 0; }
  .flip-unit .top span{ transform: translateY(50%); }
  .flip-unit .bottom{ bottom: 0; align-items: flex-start; border-radius: 0 0 10px 10px; }
  .flip-unit .bottom span{ transform: translateY(-50%); }

  .flip-unit .fold{
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    top: 50%;
    background: rgba(0,0,0,0.5);
    z-index: 5;
  }

  .flip-unit .leaf{
    position: absolute;
    left: 0; right: 0;
    height: 50%;
    background: var(--flip-bg);
    display: flex;
    justify-content: center;
    overflow: hidden;
    backface-visibility: hidden;
    z-index: 4;
  }
  .flip-unit .leaf span{
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-weight: 800;
    font-size: clamp(44px, 7.2vw, 104px);
    color: var(--accent);
    line-height: 1;
  }
  .flip-unit .leaf-top{
    top: 0;
    align-items: flex-end;
    border-radius: 10px 10px 0 0;
    transform-origin: bottom;
  }
  .flip-unit .leaf-top span{ transform: translateY(50%); }
  .flip-unit .leaf-bottom{
    bottom: 0;
    align-items: flex-start;
    border-radius: 0 0 10px 10px;
    transform-origin: top;
    transform: rotateX(90deg);
  }
  .flip-unit .leaf-bottom span{ transform: translateY(-50%); }

  .flip-unit.flipping .leaf-top{
    animation: flipTop 0.3s ease-in forwards;
  }
  .flip-unit.flipping .leaf-bottom{
    animation: flipBottom 0.3s ease-out 0.3s forwards;
  }
  @keyframes flipTop{
    0%{ transform: rotateX(0deg); }
    100%{ transform: rotateX(-90deg); }
  }
  @keyframes flipBottom{
    0%{ transform: rotateX(90deg); }
    100%{ transform: rotateX(0deg); }
  }

  .date-line{
    font-size: clamp(13px, 1.6vw, 20px);
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  /* ---------- sidebar ---------- */
  .sidebar{
    width: 340px;
    flex: 0 0 340px;
    border-left: 1px solid var(--border);
    background: var(--panel-bg);
    padding: 24px;
    overflow-y: auto;
    transition: margin-right 0.25s ease;
  }
  .sidebar.closed{ margin-right: -340px; }

  .sidebar h2{
    font-size: 20px;
    margin: 0 0 20px;
  }
  .sidebar h3{
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 10px;
  }
  .sidebar .field-label{
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .segmented{
    display: flex;
    gap: 8px;
  }
  .segmented button{
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-tertiary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .segmented button.selected{
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }

  .toggle-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 14px;
    font-weight: 600;
  }

  .switch{
    position: relative;
    width: 42px;
    height: 24px;
    border-radius: 999px;
    background: var(--switch-off);
    cursor: pointer;
  }
  .switch.on{ background: var(--blue); }
  .switch::after{
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .switch.on::after{ transform: translateX(18px); }

  .template-list{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .template-card{
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .template-card.selected{
    border-color: var(--blue);
    box-shadow: 0 0 0 1px var(--blue);
  }

  .template-preview{
    flex: 0 0 auto;
    padding: 8px 10px;
    border-radius: 8px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  .template-name{
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  /* ---------- responsive ---------- */
  .sidebar-backdrop{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 35;
  }

  @media (max-width: 900px){
    .sidebar{
      position: fixed;
      top: 66px;
      right: 0;
      bottom: 0;
      z-index: 40;
      width: 85vw;
      box-shadow: -12px 0 32px rgba(0,0,0,0.5);
      transform: translateX(0);
      margin-right: 0;
      transition: transform 0.25s ease;
    }
    .sidebar.closed{
      transform: translateX(100%);
      margin-right: 0;
    }
    .sidebar-backdrop.show{ display: block; }
  }

  @media (max-width: 640px){
    .topbar{ padding: 0 12px; height: 58px; }
    .brand{ font-size: 0; gap: 0; }
    .brand-icon{ width: 30px; height: 30px; }
    .nav-dropdown-btn{ padding: 7px 10px; font-size: 12px; gap: 5px; }
    .icon-row{ gap: 8px; }
    .icon-btn{ width: 34px; height: 34px; border-radius: 8px; }
    .icon-btn svg{ width: 16px; height: 16px; }
    .stage{ padding: 12px; gap: 12px; }
  }

  @media (max-width: 480px){
    .flip-unit{
      width: clamp(38px, 12vw, 128px);
      height: clamp(58px, 18vw, 192px);
    }
    .flip-unit .half span,
    .flip-unit .leaf span{
      font-size: clamp(28px, 9.5vw, 104px);
    }
    .flip-colon{ gap: clamp(6px, 2vw, 30px); padding: 0 2px; }
    .flip-row{ gap: clamp(3px, 1vw, 16px); }
  }
</style>
</head>

  /* ================= flip unit rendering ================= */
  function buildFlipUnit(id){
    const wrap = document.createElement("div");
    wrap.className = "flip-unit";
    wrap.id = id;
    wrap.innerHTML = `
      <div class="card-static">
        <div class="half top"><span class="val-top">0</span></div>
        <div class="half bottom"><span class="val-bottom">0</span></div>
      </div>
      <div class="leaf leaf-top"><span class="val-leaf-top">0</span></div>
      <div class="leaf leaf-bottom"><span class="val-leaf-bottom">0</span></div>
      <div class="fold"></div>
    `;
    wrap.dataset.current = "0";
    return wrap;
  }

  function setFlipUnit(id, value){
    const el = document.getElementById(id);
    if (!el) return;
    if (el.dataset.current === value) return;
    const prev = el.dataset.current;
    el.dataset.current = value;

    el.querySelector(".val-top").textContent = value;
    el.querySelector(".val-leaf-top").textContent = prev;
    el.querySelector(".val-leaf-bottom").textContent = value;
    el.querySelector(".val-bottom").textContent = value;

    el.classList.remove("flipping");
    void el.offsetWidth; // restart animation
    el.classList.add("flipping");
  }

  function buildFlipColon(id){
    const wrap = document.createElement("div");
    wrap.className = "flip-colon";
    wrap.id = id;
    wrap.innerHTML = `<div class="flip-colon-dot"></div><div class="flip-colon-dot"></div>`;
    return wrap;
  }

  const flipRow = document.getElementById("flip-row");
  ["h1","h2"].forEach(id => flipRow.appendChild(buildFlipUnit(id)));
  flipRow.appendChild(buildFlipColon("colon1"));
  ["m1","m2"].forEach(id => flipRow.appendChild(buildFlipUnit(id)));
  const secondsColon = buildFlipColon("colon2");
  flipRow.appendChild(secondsColon);
  const s1 = buildFlipUnit("s1");
  const s2 = buildFlipUnit("s2");
  flipRow.appendChild(s1);
  flipRow.appendChild(s2);

  /* ================= card color templates ================= */
  const themes = {
    "charcoal":  { label: "Charcoal",  flipBg: "#1a1a1a", accent: "#ffffff" },
    "blue":      { label: "Blue",      flipBg: "#101c2e", accent: "#4da3ff" },
    "red":       { label: "Red",       flipBg: "#2a1414", accent: "#ff5252" },
    "amber":     { label: "Amber",     flipBg: "#241c0d", accent: "#ffb020" },
    "green":     { label: "Green",     flipBg: "#0c1f11", accent: "#39ff6a" },
    "ivory":     { label: "Ivory",     flipBg: "#e9e6dd", accent: "#161616" }
  };

  const state = { format: "24", showSeconds: true, showDateLine: true, theme: "charcoal" };

  const templateList = document.getElementById("template-list");
  Object.entries(themes).forEach(([key, t]) => {
    const card = document.createElement("div");
    card.className = "template-card" + (key === state.theme ? " selected" : "");
    card.dataset.theme = key;
    card.innerHTML = `
      <div class="template-preview" style="background:${t.flipBg}; color:${t.accent}; border:1px solid ${t.flipBg === "#000000" ? "#222" : "transparent"};">24:00:00</div>
      <div class="template-name">${t.label}</div>
    `;
    card.addEventListener("click", () => applyTheme(key));
    templateList.appendChild(card);
  });

  /* ================= light / dark quick toggle ================= */
  const pageSurfaces = {
    dark:  { bg: "#000000", fg: "#ffffff", panelBg: "#0a0a0a", cardBg: "#111111", border: "#232323", muted: "#9a9a9a",
             surface1: "#131313", surface2: "#101010", hoverBg: "#1c1c1c", switchOff: "#333333",
             textSecondary: "#eeeeee", textTertiary: "#cccccc" },
    light: { bg: "#f4f4f4", fg: "#111111", panelBg: "#ffffff", cardBg: "#ffffff", border: "#dddddd", muted: "#666666",
             surface1: "#eeeeee", surface2: "#ffffff", hoverBg: "#e2e2e2", switchOff: "#cccccc",
             textSecondary: "#1a1a1a", textTertiary: "#333333" }
  };
  let isLight = false;
  function applyPageMode(mode){
    isLight = mode === "light";
    const s = pageSurfaces[mode];
    const root = document.documentElement.style;
    root.setProperty("--bg", s.bg);
    root.setProperty("--fg", s.fg);
    root.setProperty("--panel-bg", s.panelBg);
    root.setProperty("--card-bg", s.cardBg);
    root.setProperty("--border", s.border);
    root.setProperty("--muted", s.muted);
    root.setProperty("--surface-1", s.surface1);
    root.setProperty("--surface-2", s.surface2);
    root.setProperty("--hover-bg", s.hoverBg);
    root.setProperty("--switch-off", s.switchOff);
    root.setProperty("--text-secondary", s.textSecondary);
    root.setProperty("--text-tertiary", s.textTertiary);
    document.body.style.background = s.bg;
    document.body.style.color = s.fg;
    themeToggleBtn.classList.toggle("active", isLight);
    themeToggleBtn.classList.toggle("is-light", isLight);
  }
  const themeToggleBtn = document.getElementById("theme-toggle-btn");
  themeToggleBtn.addEventListener("click", () => {
    applyPageMode(isLight ? "dark" : "light");
  });

  function applyTheme(key){
    state.theme = key;
    const t = themes[key];
    document.documentElement.style.setProperty("--flip-bg", t.flipBg);
    document.documentElement.style.setProperty("--accent", t.accent);
    document.querySelectorAll(".template-card").forEach(el => {
      el.classList.toggle("selected", el.dataset.theme === key);
    });
  }

  /* ================= format toggle ================= */
  const formatToggle = document.getElementById("format-toggle");
  formatToggle.querySelectorAll("button").forEach(btn => {
    if (btn.dataset.value === state.format) btn.classList.add("selected");
    btn.addEventListener("click", () => {
      state.format = btn.dataset.value;
      formatToggle.querySelectorAll("button").forEach(b => b.classList.toggle("selected", b === btn));
      updateClock();
    });
  });

  /* ================= switches ================= */
  function wireSwitch(id, key, onChange){
    const el = document.getElementById(id);
    el.addEventListener("click", () => {
      state[key] = !state[key];
      el.classList.toggle("on", state[key]);
      if (onChange) onChange();
      updateClock();
    });
  }
  wireSwitch("seconds-switch", "showSeconds", () => {
    const display = state.showSeconds ? "" : "none";
    s1.style.display = display;
    s2.style.display = display;
    secondsColon.style.display = display;
  });
  wireSwitch("dateline-switch", "showDateLine");

  /* ================= nav dropdown ================= */
  const navBtn = document.getElementById("nav-btn");
  const navMenu = document.getElementById("nav-menu");
  navBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    navBtn.classList.toggle("open");
    navMenu.classList.toggle("open");
  });

  document.addEventListener("click", () => {
    navBtn.classList.remove("open");
    navMenu.classList.remove("open");
  });

  /* ================= sidebar toggle ================= */
  const settingsBtn = document.getElementById("settings-btn");
  const sidebar = document.getElementById("sidebar");
  const sidebarBackdrop = document.getElementById("sidebar-backdrop");
  function setSidebarOpen(open){
    sidebar.classList.toggle("closed", !open);
    settingsBtn.classList.toggle("active", open);
    sidebarBackdrop.classList.toggle("show", open);
  }
  if (window.matchMedia("(max-width: 900px)").matches) {
    setSidebarOpen(false);
  }
  settingsBtn.addEventListener("click", () => {
    setSidebarOpen(sidebar.classList.contains("closed"));
  });
  sidebarBackdrop.addEventListener("click", () => setSidebarOpen(false));

  /* ================= fullscreen ================= */
  const fullscreenBtn = document.getElementById("fullscreen-btn");
  fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
      fullscreenBtn.classList.add("active");
    } else {
      document.exitFullscreen();
      fullscreenBtn.classList.remove("active");
    }
  });

  /* ================= clock tick ================= */
  function padZero(n){ return String(n).padStart(2, "0"); }

  function updateClock(){
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

    if (state.format === "12") {
      hours = hours % 12;
      hours = hours === 0 ? 12 : hours;
    }

    const hStr = padZero(hours);
    const mStr = padZero(minutes);
    const sStr = padZero(seconds);

    setFlipUnit("h1", hStr[0]);
    setFlipUnit("h2", hStr[1]);
    setFlipUnit("m1", mStr[0]);
    setFlipUnit("m2", mStr[1]);
    setFlipUnit("s1", sStr[0]);
    setFlipUnit("s2", sStr[1]);

    if (state.showDateLine) {
      const options = { weekday: "long", month: "long", day: "numeric", year: "numeric" };
      document.getElementById("date-display").textContent = now.toLocaleDateString("en-US", options);
      document.getElementById("date-display").style.display = "block";
    } else {
      document.getElementById("date-display").style.display = "none";
    }
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
